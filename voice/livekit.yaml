# LiveKit server config. Docs: https://docs.livekit.io/home/self-hosting/deployment/
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882            # single-port UDP mux, so the router only needs one UDP forward
  use_external_ip: true     # discovers the home's public IP via STUN
keys:
  # Must match livekit.api_key / api_secret in hub/config.yaml
  CHANGE-ME: CHANGE-ME-at-least-32-characters-long
room:
  empty_timeout: 300
  max_participants: 6       # GUESS: a kid plus a few friends
logging:
  level: info
