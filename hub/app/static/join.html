<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Chat</title>
<link rel="stylesheet" href="/static/app.css">
<!-- GUESS: pinned LiveKit browser client. Vendor this file into /static if you prefer no CDN. -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js"></script>
</head>
<body>
<main>
  <h1 id="title">Voice chat</h1>
  <div class="card">
    <p id="status">Press Join to talk. Your browser will ask to use the microphone.</p>
    <div class="actions">
      <button id="join">Join</button>
      <button id="mute" class="ghost" hidden>Mute my mic</button>
      <button id="leave" class="bad" hidden>Leave</button>
    </div>
  </div>
  <ul id="people" class="list"></ul>
  <p class="muted">Voice only. A parent created this link and can switch it off at any time.</p>
</main>
<script>
const code = location.pathname.split("/").pop();
const LK = window.LivekitClient;
let room;
const $ = (s) => document.querySelector(s);

let who = "", micNote = "";
// Nobody can mute anybody else: the button is your own microphone, the words after a name only describe.
function row(p) {
  const state = !p.isMicrophoneEnabled ? '<span class="muted"> · mic off</span>' : p.isSpeaking ? "<b> · talking</b>" : "";
  return `<li>${(p.name || p.identity).replace(/[<>&]/g, "")}${p === room.localParticipant ? " (you)" : ""}${state}</li>`;
}
function renderPeople() {
  if (!room || room.state !== LK.ConnectionState.Connected) return;
  $("#people").innerHTML = [room.localParticipant, ...room.remoteParticipants.values()].map(row).join("");
  $("#mute").textContent = room.localParticipant.isMicrophoneEnabled ? "Mute my mic" : "Unmute my mic";
  $("#status").textContent = `Connected as ${who}.` + (micNote ? " " + micNote : "");
}
async function setMic(on) {
  try { await room.localParticipant.setMicrophoneEnabled(on); micNote = ""; }
  catch (e) { micNote = "Your microphone is off or blocked for this page, so nobody can hear you."; }
  renderPeople();
}

$("#join").onclick = async () => {
  $("#status").textContent = "Connecting…";
  const r = await fetch(`/api/voice/join/${code}`, { method: "POST" });
  const j = await r.json();
  if (!r.ok) { $("#status").textContent = j.detail || "This link is not active."; return; }
  $("#title").textContent = `Voice chat with ${j.kid_name}`;
  who = j.friend_name;
  room = new LK.Room({ audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true } });
  room.on(LK.RoomEvent.TrackSubscribed, (track) => { if (track.kind === "audio") document.body.appendChild(track.attach()); })
      .on(LK.RoomEvent.Disconnected, () => { $("#status").textContent = "Disconnected."; $("#people").innerHTML = ""; $("#join").hidden = false; $("#mute").hidden = $("#leave").hidden = true; });
  for (const ev of ["ParticipantConnected", "ParticipantDisconnected", "ActiveSpeakersChanged", "TrackMuted", "TrackUnmuted",
                    "TrackPublished", "TrackUnpublished", "LocalTrackPublished", "LocalTrackUnpublished"]) room.on(LK.RoomEvent[ev], renderPeople);
  try { await room.connect(j.url, j.token); }
  catch (e) { $("#status").textContent = "Couldn't connect. Check your internet connection and try again."; return; }
  $("#join").hidden = true; $("#mute").hidden = $("#leave").hidden = false;
  await setMic(true);
};
$("#mute").onclick = () => setMic(!room.localParticipant.isMicrophoneEnabled);
$("#leave").onclick = () => room && room.disconnect();
</script>
</body>
</html>
