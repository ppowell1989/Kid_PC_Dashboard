<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids PC Hub</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main id="login" hidden>
  <h1>Kids PC Hub</h1>
  <form id="loginForm" class="card">
    <label>Name <input name="name" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button>Sign in</button>
    <p class="err" id="loginErr"></p>
  </form>
</main>

<main id="app" hidden>
  <header>
    <h1>Kids PC Hub</h1>
    <nav>
      <button data-tab="now" class="on">Now</button>
      <button data-tab="requests">Requests <span id="reqCount"></span></button>
      <button data-tab="web">Web</button>
      <button data-tab="games">Games</button>
      <button data-tab="voice">Voice</button>
    </nav>
  </header>

  <section data-panel="now"><div id="kids"></div></section>

  <section data-panel="requests" hidden><div id="requests"></div></section>

  <section data-panel="web" hidden>
    <div class="row">
      <select id="webKid"></select>
      <select id="webSource"><option value="">All</option><option value="chrome">Pages (Chrome)</option><option value="dns">Sites (network)</option></select>
    </div>
    <ul id="visits" class="list"></ul>
    <h2>Allowed sites <small id="webMode"></small></h2>
    <form id="siteForm" class="row"><input name="domain" placeholder="example.com" required><button>Add</button></form>
    <ul id="sites" class="list"></ul>
  </section>

  <section data-panel="games" hidden>
    <form id="gameForm" class="card">
      <h2>Add a game to the catalogue</h2>
      <label>Title <input name="title" required></label>
      <label>Launcher
        <select name="launcher">
          <option value="steam">Steam (app id)</option>
          <option value="battlenet">Battle.net (product code)</option>
          <option value="gamepass">Game Pass (app id)</option>
          <option value="direct">Direct (exe path)</option>
        </select>
      </label>
      <label>Launch reference <input name="launch_ref" placeholder="e.g. 730 or WoW" required></label>
      <label>Rating <input name="rating" placeholder="E10+"></label>
      <fieldset id="gameKids"><legend>Approved for</legend></fieldset>
      <button>Add</button>
    </form>
    <ul id="games" class="list"></ul>
  </section>

  <section data-panel="voice" hidden>
    <form id="inviteForm" class="card">
      <h2>New invite link</h2>
      <label>For <select name="kid_id" id="inviteKid"></select></label>
      <label>Friend's name <input name="friend_name" required></label>
      <button>Create link</button>
    </form>
    <ul id="invites" class="list"></ul>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
