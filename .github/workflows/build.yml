name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hub:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: hub } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Build shell and helper
        shell: pwsh
        run: ./windows/build.ps1 -Runtime ${{ matrix.rid }}
      - name: Bundle with setup scripts
        shell: pwsh
        run: |
          $out = "kidspc-${{ matrix.rid }}"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item -Recurse windows/publish/${{ matrix.rid }}/* $out/
          Copy-Item -Recurse windows/setup $out/setup
          Copy-Item -Recurse chrome $out/chrome
      - uses: actions/upload-artifact@v4
        with:
          name: kidspc-${{ matrix.rid }}
          path: kidspc-${{ matrix.rid }}
