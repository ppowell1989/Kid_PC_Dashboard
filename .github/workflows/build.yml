name: build
on:
  push:
    branches-ignore: [ci-screenshots]
  pull_request:
  workflow_dispatch:

jobs:
  hub:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: hub } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg   # chat video clips
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Walk through every feature on a running hub
        run: python tests/e2e_live.py local

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Build shell and helper
        shell: pwsh
        run: ./windows/build.ps1 -Runtime ${{ matrix.rid }} -Version ${{ github.sha }}
      - name: Bundle with setup scripts
        shell: pwsh
        run: |
          $out = "kidspc-${{ matrix.rid }}"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item -Recurse windows/publish/${{ matrix.rid }}/* $out/
          Copy-Item -Recurse windows/setup $out/setup
          Copy-Item -Recurse chrome $out/chrome
      - uses: actions/upload-artifact@v4
        with:
          name: kidspc-${{ matrix.rid }}
          path: kidspc-${{ matrix.rid }}

  integration:
    needs: [hub, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r hub/requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: kidspc-win-x64, path: bundle }
      - name: Shell + helper against a live hub
        shell: pwsh
        run: ./windows/tests/Integration.ps1 -BuildDir bundle
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: ${{ runner.temp }}/kidspc-it

  launchers:
    # Tries the one install that has no silent mode (Battle.net) on a real Windows, with the helper running
    # as SYSTEM with no desktop like the installed service. It takes minutes and depends on Blizzard's
    # servers, so it reports its result without holding up or failing a build.
    needs: [hub, windows]
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r hub/requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: kidspc-win-x64, path: bundle }
      - name: Helper installs Battle.net by itself
        shell: pwsh
        run: ./windows/tests/Integration.ps1 -BuildDir bundle -LauncherInstall -AsSystem
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-logs
          path: ${{ runner.temp }}/kidspc-it

  fresh-pc:
    # The Christmas path: a clean Windows machine, the dashboard's "Set up a new PC" line pasted into
    # Windows PowerShell, and a check of everything Windows will use at the next start.
    needs: [hub, windows]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r hub/requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: kidspc-win-x64, path: bundle }
      - name: New PC from one pasted line
        shell: pwsh
        run: ./windows/tests/FreshPc.ps1 -BuildDir bundle
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-pc-logs
          path: ${{ runner.temp }}/kidspc-fresh

  screenshots:
    # Real Windows screenshots of every shell screen (demo data), so the design is checked on actual pixels.
    # Download the "shell-screenshots" artifact, or browse the ci-screenshots branch (one folder per branch).
    needs: [windows]
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: kidspc-win-x64, path: bundle }
      - name: Screenshot every shell screen
        shell: pwsh
        run: ./windows/tests/Screenshots.ps1 -BuildDir bundle -Out shots
      - uses: actions/upload-artifact@v4
        with: { name: shell-screenshots, path: shots }
      - name: Publish to the ci-screenshots branch
        if: github.event_name == 'push'
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          slug="${GITHUB_REF_NAME//\//-}"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for try in 1 2 3; do
            rm -rf pub && git init -q pub && cd pub
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git fetch -q --depth 1 "$url" ci-screenshots; then git checkout -q -b ci-screenshots FETCH_HEAD; else git checkout -q --orphan ci-screenshots; fi
            rm -rf "$slug" && mkdir -p "$slug" && cp ../shots/* "$slug/"
            git add -A
            git commit -q -m "Shell screenshots: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" || { echo "No change"; exit 0; }
            if git push -q "$url" ci-screenshots; then exit 0; fi
            cd .. && sleep $((try * 5))
          done
          exit 1

  hub-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker image builds and serves
        run: |
          docker build -t kidspc-hub hub
          mkdir -p /tmp/data && cp hub/config.example.yaml /tmp/data/config.yaml
          sed -i 's/enabled: true/enabled: false/' /tmp/data/config.yaml
          docker run -d --name hub -p 8080:8080 -v /tmp/data:/data kidspc-hub
          for i in $(seq 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q "Kids PC Hub"
          curl -fs -H "Authorization: Bearer CHANGE-ME-adam-device-token" localhost:8080/api/device/rules   # exercises timezone data
          docker logs hub

  hub-autoupdate:
    # The hub's self-updater on a pretend TrueNAS with real Docker: a good merge goes in by itself, a broken
    # one is rolled back with the database put back, and the GitHub token never reaches a log.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: sudo bash deploy/tests/autoupdate-test.sh

  test-release:
    # Publishes the latest main build as a pre-release named "test-build", so it downloads like a normal file.
    if: github.ref == 'refs/heads/main'
    needs: [integration]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: kidspc-win-*, path: dl }
      - name: Zip and publish
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: |
          cd dl
          for d in kidspc-win-*; do (cd "$d" && zip -qr "../$d.zip" .); done
          gh release delete test-build -y --cleanup-tag || true
          gh release create test-build kidspc-win-*.zip --prerelease --target "${{ github.sha }}" \
            --title "Test build $(date -u +%Y-%m-%d\ %H:%M) UTC" \
            --notes "Latest main build. Unzip to C:\\kidspc (VM on a Mac: kidspc-win-arm64.zip)."
