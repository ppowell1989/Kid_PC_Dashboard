<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat with a friend</title>
<!-- GUESS: pinned LiveKit browser client. To avoid the CDN, download this file into Assets\ and point at it. -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js"></script>
<style>
  /* Matches the shell's retro-space theme (colours only: this page has no access to the app's fonts). */
  body { margin: 0; padding: 24px; color: #fff; font: 18px/1.4 Bahnschrift, "Segoe UI", sans-serif;
         background: radial-gradient(120% 80% at 80% 0%, #2a1260, #0b0628 55%, #03020f); min-height: 100vh; box-sizing: border-box; }
  h1 { font: 900 26px/1.1 "Segoe UI Black", "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: .02em; margin: 0 0 14px;
       color: #ffd23f; text-shadow: 2px 2px 0 #ff2e97; }
  button { font: 900 15px/1 "Segoe UI Black", "Segoe UI", sans-serif; text-transform: uppercase; padding: 12px 22px; border-radius: 14px; border: 0;
           background: linear-gradient(#7df1ff, #22e4ff); color: #06122b; margin-right: 8px; cursor: pointer; box-shadow: 0 5px 0 #0a7fa3; }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 #0a7fa3; }
  ul { list-style: none; padding: 0; margin: 18px 0; }
  li { background: #1a1060; border: 2px solid #4b3bb0; border-radius: 14px; padding: 10px 14px; margin: 8px 0; }
  .muted { color: #b3a9e8; font-size: 15px; }
</style>
</head>
<body>
<h1>Voice chat</h1>
<p id="status" class="muted">Connecting…</p>
<div><button id="mute">Mute</button></div>
<ul id="people"></ul>
<p class="muted">Friends join with the link Mom or Dad sent them. Close this window to leave.</p>
<script>
const p = new URLSearchParams(location.hash.slice(1));
const LK = window.LivekitClient;
const room = new LK.Room({ audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true } });
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[<>&]/g, "");
function render() {
  const all = [room.localParticipant, ...room.remoteParticipants.values()];
  $("#people").innerHTML = all.map((x) => `<li>${x.isSpeaking ? "🔊" : "🔈"} ${esc(x.name || x.identity)}${x === room.localParticipant ? " (you)" : ""}</li>`).join("");
  $("#status").textContent = room.remoteParticipants.size ? "Connected." : "Waiting for a friend to join…";
}
room.on(LK.RoomEvent.TrackSubscribed, (t) => { if (t.kind === "audio") document.body.appendChild(t.attach()); })
    .on(LK.RoomEvent.ParticipantConnected, render).on(LK.RoomEvent.ParticipantDisconnected, render)
    .on(LK.RoomEvent.ActiveSpeakersChanged, render)
    .on(LK.RoomEvent.Disconnected, () => ($("#status").textContent = "Disconnected."));
(async () => {
  try {
    await room.connect(p.get("url"), p.get("token"));
    await room.localParticipant.setMicrophoneEnabled(true);
    render();
  } catch (e) { $("#status").textContent = "Couldn't connect: " + e.message; }
})();
$("#mute").onclick = async () => {
  const on = room.localParticipant.isMicrophoneEnabled;
  await room.localParticipant.setMicrophoneEnabled(!on);
  $("#mute").textContent = on ? "Unmute" : "Mute";
};
</script>
</body>
</html>
