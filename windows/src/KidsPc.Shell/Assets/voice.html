<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat with a friend</title>
<!-- GUESS: pinned LiveKit browser client. To avoid the CDN, download this file into Assets\ and point at it. -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js"></script>
<style>
  body { margin: 0; background: #101317; color: #eef1f4; font: 18px/1.4 "Segoe UI", sans-serif; padding: 24px; }
  h1 { font-size: 24px; margin: 0 0 16px; }
  button { font: inherit; padding: 10px 18px; border-radius: 20px; border: 0; background: #4f8cff; color: #fff; margin-right: 8px; cursor: pointer; }
  ul { list-style: none; padding: 0; } li { background: #1b2027; border-radius: 10px; padding: 10px 14px; margin: 6px 0; }
  .muted { color: #8f9aa6; font-size: 15px; }
</style>
</head>
<body>
<h1>Voice chat</h1>
<p id="status" class="muted">Connecting…</p>
<div><button id="mute">Mute my mic</button></div>
<ul id="people"></ul>
<p class="muted">Friends join with the link Mom or Dad sent them. Close this window to leave.</p>
<script>
const p = new URLSearchParams(location.hash.slice(1));
const LK = window.LivekitClient;
const room = new LK.Room({ audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true } });
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[<>&]/g, "");
let micNote = "";   // set when this PC's microphone can't be switched on
// Nobody can mute anybody else: the button is your own microphone, the words after a name only describe.
function row(x) {
  const state = !x.isMicrophoneEnabled ? '<span class="muted"> · mic off</span>' : x.isSpeaking ? "<b> · talking</b>" : "";
  return `<li>${esc(x.name || x.identity)}${x === room.localParticipant ? " (you)" : ""}${state}</li>`;
}
function render() {
  if (room.state !== LK.ConnectionState.Connected) return;
  $("#people").innerHTML = [room.localParticipant, ...room.remoteParticipants.values()].map(row).join("");
  $("#mute").textContent = room.localParticipant.isMicrophoneEnabled ? "Mute my mic" : "Unmute my mic";
  $("#status").textContent = micNote || (room.remoteParticipants.size ? "Connected." : "Waiting for a friend to join…");
}
async function setMic(on) {
  try { await room.localParticipant.setMicrophoneEnabled(on); micNote = ""; }
  catch (e) { micNote = "Your microphone isn't working, so friends can't hear you. You can still listen."; }
  render();
}
room.on(LK.RoomEvent.TrackSubscribed, (t) => { if (t.kind === "audio") document.body.appendChild(t.attach()); })
    .on(LK.RoomEvent.Disconnected, () => ($("#status").textContent = "Disconnected."));
for (const ev of ["ParticipantConnected", "ParticipantDisconnected", "ActiveSpeakersChanged", "TrackMuted", "TrackUnmuted",
                  "TrackPublished", "TrackUnpublished", "LocalTrackPublished", "LocalTrackUnpublished"]) room.on(LK.RoomEvent[ev], render);
(async () => {
  try { await room.connect(p.get("url"), p.get("token")); }
  catch (e) { $("#status").textContent = "Couldn't connect: " + e.message; return; }
  await setMic(true);
})();
$("#mute").onclick = () => setMic(!room.localParticipant.isMicrophoneEnabled);
</script>
</body>
</html>
