<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat with a friend</title>
<!-- GUESS: pinned LiveKit browser client. To avoid the CDN, download this file into Assets\ and point at it. -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js"></script>
<style>
  /* The kid's voice room, in the shell's clean light theme. The window frame and Leave button are drawn by VoiceWindow.xaml. */
  @font-face { font-family: "Nunito Text"; src: url("Fonts/NunitoText.ttf"); }
  @font-face { font-family: "Nunito Display"; src: url("Fonts/NunitoDisplay.ttf"); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; padding: 20px 22px; color: #18213a; font: 17px/1.4 "Nunito Text", "Segoe UI", sans-serif; user-select: none; overflow: hidden;
         background: #f4f7fc; display: flex; flex-direction: column; gap: 16px; }
  #status { margin: 0; font-size: 16px; color: #67718b; }
  #status.bad { color: #c92a2f; }
  #people { list-style: none; margin: -10px; padding: 10px; flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start; overflow-y: auto; }
  .person { background: #fff; border: 3px solid transparent; border-radius: 20px; padding: 18px 8px 14px; text-align: center; box-shadow: 0 4px 16px #3a4a7820; }
  .orb { width: 72px; height: 72px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center;
         font: 32px/1 "Nunito Display", "Segoe UI", sans-serif; color: #fff; background: #3d6bf5; }
  .person:nth-child(4n+2) .orb { background: #1fa971; }
  .person:nth-child(4n+3) .orb { background: #f28c28; }
  .person:nth-child(4n+4) .orb { background: #7c5cfc; }
  .pname { font: 18px "Nunito Display", "Segoe UI", sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pname small { color: #67718b; font: 15px "Nunito Text", "Segoe UI", sans-serif; }
  .pstate { font-size: 14px; color: #67718b; margin-top: 2px; }
  .person.talking { border-color: #1fa971; }
  .person.talking .pstate { color: #17865a; }
  .person.muted .orb { background: #c5cedf; }
  .person.muted .pstate { color: #c92a2f; }
  .empty { grid-column: 1 / -1; color: #67718b; text-align: center; padding: 20px 10px; border: 2px dashed #c5cedf; border-radius: 20px; }
  #mute { width: 100%; font: 19px/1 "Nunito Display", "Segoe UI", sans-serif; padding: 17px 10px 18px; border: 0; border-radius: 16px; cursor: pointer;
          color: #fff; background: #3d6bf5; }
  #mute:hover { filter: brightness(.95); }
  #mute.off { background: #e5484d; }
  .hint { margin: 0; color: #67718b; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<p id="status">Connecting…</p>
<ul id="people"></ul>
<button id="mute">Mute my mic</button>
<p class="hint">This button only changes your own microphone. Friends join with the link Mom or Dad sent them.</p>
<script>
const p = new URLSearchParams(location.hash.slice(1));
const LK = window.LivekitClient;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[<>&"]/g, "");
const demo = p.get("url") === "demo";   // "KidsPcShell.exe --demo voice": a made-up room, for looking at the design

// One card per person. The only microphone anyone can switch is their own.
function draw(people, micOn) {
  $("#people").innerHTML = people.map((x) => `<li class="person ${x.muted ? "muted" : x.talking ? "talking" : ""}">
      <div class="orb">${esc(x.name).slice(0, 1).toUpperCase()}</div>
      <div class="pname">${esc(x.name)}${x.me ? " <small>(you)</small>" : ""}</div>
      <div class="pstate">${x.muted ? "mic off" : x.talking ? "talking" : "listening"}</div></li>`).join("")
    + (people.length < 2 ? `<li class="empty">Waiting for a friend to join…</li>` : "");
  $("#status").textContent = people.length < 2 ? "You're in. Nobody else is here yet." : "Connected";
  $("#mute").textContent = micOn ? "Mute my mic" : "Unmute my mic";
  $("#mute").classList.toggle("off", !micOn);
}

if (demo) {
  let on = true;
  const show = () => draw([{ name: p.get("name") || "Adam", me: true, muted: !on }, { name: "Max", talking: true }, { name: "Oliver", muted: true }], on);
  $("#mute").onclick = () => { on = !on; show(); };
  show();
} else if (!LK) {
  $("#status").textContent = "Voice chat couldn't load. Ask Mom or Dad."; $("#status").className = "bad";
} else {
  const room = new LK.Room({ audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true } });
  let micNote = "";   // set when the microphone can't be switched on, shown in place of the status
  const render = () => {
    if (room.state !== LK.ConnectionState.Connected) return;
    const all = [room.localParticipant, ...room.remoteParticipants.values()];
    draw(all.map((x) => ({ name: x.name || x.identity, me: x === room.localParticipant, muted: !x.isMicrophoneEnabled, talking: x.isSpeaking })),
         room.localParticipant.isMicrophoneEnabled);
    if (micNote) $("#status").textContent = micNote;
    $("#status").className = micNote ? "bad" : "";
  };
  async function setMic(on) {
    try { await room.localParticipant.setMicrophoneEnabled(on); micNote = ""; }
    catch (e) { micNote = "Your microphone isn't working. You can still listen. Ask Mom or Dad."; }
    render();
  }
  const E = LK.RoomEvent;
  room.on(E.TrackSubscribed, (t) => { if (t.kind === "audio") document.body.appendChild(t.attach()); render(); });
  for (const e of [E.ParticipantConnected, E.ParticipantDisconnected, E.ActiveSpeakersChanged, E.TrackMuted, E.TrackUnmuted,
                   E.TrackPublished, E.TrackUnpublished, E.LocalTrackPublished, E.LocalTrackUnpublished])
    room.on(e, render);
  room.on(E.Disconnected, () => { $("#status").textContent = "Disconnected"; $("#status").className = "bad"; });
  (async () => {
    try { await room.connect(p.get("url"), p.get("token")); }
    catch (e) { $("#status").textContent = "Couldn't connect: " + e.message; $("#status").className = "bad"; return; }
    await setMic(true);
  })();
  $("#mute").onclick = () => setMic(!room.localParticipant.isMicrophoneEnabled);
}
</script>
</body>
</html>
